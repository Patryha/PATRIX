# Środowisko staging/produkcja PATRIX. Sekrety podaj w pliku infra/.env (wzór: infra/.env.example).
# Obrazy buduje i uruchamia scripts/deploy.sh (DEPLOYMENT.md): backend → seed i klucz publikowalny → build sklepu → całość.
# Compose tylko uruchamia gotowe obrazy: build sklepu potrzebuje sieci hosta (dane z działającego backendu),
# a nowy Docker Compose wymaga na to interaktywnej zgody, której skrypt nie może dać (D-039).
name: patrix

x-backend-env: &backend-env
  NODE_ENV: production
  # Baza w wewnętrznej sieci Dockera bez TLS; Medusa domyślnie włącza SSL dla każdego hosta poza localhost.
  DATABASE_URL: postgres://patrix:${POSTGRES_PASSWORD}@postgres:5432/patrix?sslmode=disable
  REDIS_URL: redis://redis:6379

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: patrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD}
      POSTGRES_DB: patrix
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrix"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?ustaw S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?ustaw S3_SECRET_ACCESS_KEY}
    volumes: [minio-data:/data]

  backend:
    image: patrix-backend:latest
    pull_policy: never
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    env_file: .env
    environment:
      <<: *backend-env
      MEDUSA_WORKER_MODE: server
    # Tylko na localhost serwera: build sklepu pobiera dane z działającego backendu. Z zewnątrz ruch idzie przez Caddy.
    ports: ["127.0.0.1:${BACKEND_HOST_PORT:-9000}:9000"]
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:9000/health').then(r=>process.exit(r.ok?0:1),()=>process.exit(1))"]
      interval: 10s
      start_period: 120s
      retries: 6

  worker:
    image: patrix-backend:latest
    pull_policy: never
    restart: unless-stopped
    # Migracje wykonuje tylko backend (Medusa nie blokuje równoległych migracji), więc worker czeka na jego gotowość.
    depends_on:
      backend: { condition: service_healthy }
    command: ["npx", "medusa", "start"]
    env_file: .env
    environment:
      <<: *backend-env
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"

  storefront:
    image: patrix-storefront:latest
    pull_policy: never
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    environment:
      MEDUSA_BACKEND_URL: http://backend:9000
      PATRIX_ADMIN_URL: ${PATRIX_ADMIN_URL}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?ustaw SHOP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?ustaw API_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    depends_on: [backend, storefront]

volumes:
  pg-data:
  redis-data:
  minio-data:
  caddy-data:
