# Środowisko lokalne/staging PATRIX. Sekrety podaj w pliku infra/.env (wzór: infra/.env.example).
name: patrix

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_USER: patrix
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ustaw POSTGRES_PASSWORD}
      POSTGRES_DB: patrix
    volumes: [pg-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U patrix"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes: [redis-data:/data]

  minio:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:?ustaw S3_ACCESS_KEY_ID}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:?ustaw S3_SECRET_ACCESS_KEY}
    volumes: [minio-data:/data]

  backend:
    build: ../apps/backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://patrix:${POSTGRES_PASSWORD}@postgres:5432/patrix
      REDIS_URL: redis://redis:6379
      MEDUSA_WORKER_MODE: server

  worker:
    build: ../apps/backend
    restart: unless-stopped
    depends_on: [backend]
    env_file: .env
    environment:
      NODE_ENV: production
      DATABASE_URL: postgres://patrix:${POSTGRES_PASSWORD}@postgres:5432/patrix
      REDIS_URL: redis://redis:6379
      MEDUSA_WORKER_MODE: worker
      DISABLE_MEDUSA_ADMIN: "true"

  storefront:
    build:
      context: ../apps/storefront
      args:
        NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY: ${NEXT_PUBLIC_MEDUSA_PUBLISHABLE_KEY}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL}
    restart: unless-stopped
    depends_on: [backend]
    environment:
      MEDUSA_BACKEND_URL: http://backend:9000
      PATRIX_ADMIN_URL: ${PATRIX_ADMIN_URL}

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports: ["80:80", "443:443"]
    environment:
      SHOP_DOMAIN: ${SHOP_DOMAIN:?ustaw SHOP_DOMAIN}
      API_DOMAIN: ${API_DOMAIN:?ustaw API_DOMAIN}
    volumes:
      - ./caddy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data

volumes:
  pg-data:
  redis-data:
  minio-data:
  caddy-data:
