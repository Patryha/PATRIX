version: 2
updates:
  - package-ecosystem: npm
    directory: /apps/backend
    schedule: { interval: weekly }
    groups:
      medusa:
        patterns: ["@medusajs/*"]
  - package-ecosystem: npm
    directory: /apps/storefront
    schedule: { interval: weekly }
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: monthly }
